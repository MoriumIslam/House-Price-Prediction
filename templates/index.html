<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🏠 House Price Prediction</h1>
            <p class="subtitle">Predict house prices using machine learning</p>
            
            <form id="predictionForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="longitude">Longitude:</label>
                        <input type="number" id="longitude" name="longitude" placeholder="-124.35" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="latitude">Latitude:</label>
                        <input type="number" id="latitude" name="latitude" placeholder="41.89" step="0.01" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="housing_median_age">Housing Median Age (years):</label>
                        <input type="number" id="housing_median_age" name="housing_median_age" placeholder="28" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="median_income">Median Income:</label>
                        <input type="number" id="median_income" name="median_income" placeholder="3.87" step="0.01" min="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="total_rooms">Total Rooms:</label>
                        <input type="number" id="total_rooms" name="total_rooms" placeholder="2500" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="total_bedrooms">Total Bedrooms:</label>
                        <input type="number" id="total_bedrooms" name="total_bedrooms" placeholder="500" min="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="population">Population:</label>
                        <input type="number" id="population" name="population" placeholder="1500" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="households">Households:</label>
                        <input type="number" id="households" name="households" placeholder="700" min="0" required>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="ocean_proximity">Ocean Proximity:</label>
                    <select id="ocean_proximity" name="ocean_proximity" required>
                        <option value="">-- Select --</option>
                        <option value="INLAND">Inland</option>
                        <option value="NEAR OCEAN">Near Ocean</option>
                        <option value="NEAR BAY">Near Bay</option>
                        <option value="ISLAND">Island</option>
                    </select>
                </div>

                <button type="submit" class="btn-predict">💰 Predict Price</button>
            </form>

            <div id="result" class="result hidden">
                <h2>Predicted House Price</h2>
                <div class="price-display">
                    <span id="priceValue" class="price">$0.00</span>
                </div>
                <button type="button" class="btn-reset" onclick="resetForm()">Predict Another</button>
            </div>

            <div id="error" class="error hidden">
                <p id="errorMessage"></p>
            </div>
        </div>

        <div class="info-card">
            <h3>📋 How to Use</h3>
            <ul>
                <li>Enter the house details in the form above</li>
                <li>Click "Predict Price" to get the estimated price</li>
                <li>The ML model will analyze the features and provide a prediction</li>
            </ul>
        </div>
    </div>

    <script>
        const form = document.getElementById('predictionForm');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const priceValue = document.getElementById('priceValue');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide previous results/errors
            resultDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');

            // Collect form data
            const formData = new FormData(form);
            const oceanProximity = formData.get('ocean_proximity');

            // Create data object with one-hot encoded ocean_proximity
            const data = {
                longitude: formData.get('longitude'),
                latitude: formData.get('latitude'),
                housing_median_age: formData.get('housing_median_age'),
                total_rooms: formData.get('total_rooms'),
                total_bedrooms: formData.get('total_bedrooms'),
                population: formData.get('population'),
                households: formData.get('households'),
                median_income: formData.get('median_income'),
                ocean_proximity_INLAND: oceanProximity === 'INLAND' ? 1 : 0,
                ocean_proximity_ISLAND: oceanProximity === 'ISLAND' ? 1 : 0,
                ocean_proximity_NEAR_BAY: oceanProximity === 'NEAR BAY' ? 1 : 0,
                ocean_proximity_NEAR_OCEAN: oceanProximity === 'NEAR OCEAN' ? 1 : 0
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    priceValue.textContent = '$' + result.predicted_price.toLocaleString();
                    resultDiv.classList.remove('hidden');
                } else {
                    throw new Error(result.error || 'Prediction failed');
                }
            } catch (error) {
                errorMessage.textContent = 'Error: ' + error.message;
                errorDiv.classList.remove('hidden');
            }
        });

        function resetForm() {
            form.reset();
            resultDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
        }
    </script>
</body>
</html>
